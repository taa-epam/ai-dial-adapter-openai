name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

jobs:
  run_tests:
    uses: taa-epam/ai-dial-ci/.github/workflows/python_docker_pr.yml@ad5ace9000ee8387f343d6b49fff876ed7cf1347
    secrets:
      GPR_USERNAME: ${{ secrets.GPR_USERNAME }}
      GPR_PASSWORD: ${{ secrets.GPR_PASSWORD }}
    with:
      platforms: "linux/amd64,linux/arm64"