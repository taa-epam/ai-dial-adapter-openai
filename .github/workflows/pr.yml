name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/python_docker_pr.yml@2.4.1
    secrets:
      GPR_USERNAME: ${{ secrets.GPR_USERNAME }}
      GPR_PASSWORD: ${{ secrets.GPR_PASSWORD }}
    with:
      platforms: "linux/amd64,linux/arm64"